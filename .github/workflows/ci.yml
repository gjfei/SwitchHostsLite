name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: scripts/install-linux-deps.sh

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup component add clippy
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
