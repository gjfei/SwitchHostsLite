# Errors
err_hosts_not_utf8:
  zh-CN: "hosts 文件不是 UTF-8 编码，为避免破坏原有内容已停止写入，请先将其另存为 UTF-8"
  zh-TW: "hosts 檔案不是 UTF-8 編碼，為避免破壞原有內容已停止寫入，請先將其另存為 UTF-8"
  en: "The hosts file is not UTF-8 encoded. Writing was stopped to keep its content intact; please save it as UTF-8 first."
